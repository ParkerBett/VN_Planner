<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VN Planner</title><style>
:root{--bg:#f4f4f5;--card:#fff;--text:#18181b;--muted:#71717a;--border:#d4d4d8;--accent:#4f46e5}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}header{background:#18181b;color:white;padding:28px max(20px,calc((100% - 1000px)/2));position:sticky;top:0;z-index:5}header h1{margin:0 0 5px}header p{margin:0;color:#d4d4d8}main{max-width:1000px;margin:28px auto 70px;padding:0 20px}section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:18px}h2{margin:0 0 16px}label{display:block;font-weight:600;margin:14px 0 7px}input,textarea,select{width:100%;border:1px solid var(--border);border-radius:9px;padding:11px 12px;font:inherit;background:#fff}textarea{min-height:95px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;align-items:center}button{border:0;border-radius:9px;padding:11px 15px;font:inherit;font-weight:650;cursor:pointer;background:var(--accent);color:white}button.secondary{background:#e4e4e7;color:#18181b}button.danger{background:#dc2626}.status{color:var(--muted);font-size:14px;margin-left:auto}.item{border:1px solid var(--border);border-radius:11px;padding:16px;margin-top:12px;background:#fafafa}.item-title{display:flex;gap:10px;align-items:center}.item-title input{flex:1}.remove{background:#e4e4e7;color:#18181b}@media(max-width:700px){.grid{grid-template-columns:1fr}header{position:static}.status{width:100%;margin-left:0}}
</style></head><body><header><h1>Visual Novel Planner</h1><p>Plan enough to make the VN — then keep changing the plan as you build.</p></header><main>
<div class="actions"><button onclick="savePlan()">Save Plan</button><button class="secondary" onclick="loadPlan()">Load Plan</button><button class="secondary" onclick="exportPlan()">Export JSON</button><button class="secondary" onclick="document.getElementById('file').click()">Import JSON</button><button class="danger" onclick="clearPlan()">Clear</button><input id="file" type="file" accept=".json" hidden onchange="importPlan(event)"><span class="status" id="status">Autosaves in this browser</span></div>
<section><h2>1. Project</h2><div class="grid"><div><label>Title</label><input data-key="project.title"></div><div><label>Working Title</label><input data-key="project.workingTitle"></div></div><label>One-sentence pitch</label><textarea data-key="project.pitch"></textarea><label>Core idea</label><textarea data-key="project.coreIdea"></textarea><label>What should the player feel?</label><textarea data-key="project.playerFeeling"></textarea><label>Genre / tone</label><input data-key="project.genreTone"></section>
<section><h2>2. Story</h2><label>Central conflict</label><textarea data-key="story.conflict"></textarea><label>Beginning</label><textarea data-key="story.beginning"></textarea><label>Middle</label><textarea data-key="story.middle"></textarea><label>Major revelation(s)</label><textarea data-key="story.revelations"></textarea><label>Climax</label><textarea data-key="story.climax"></textarea><label>Ending</label><textarea data-key="story.ending"></textarea><label>What changes from beginning to end?</label><textarea data-key="story.change"></textarea></section>
<section><h2>3. Protagonist</h2><div class="grid"><div><label>Name</label><input data-key="protagonist.name"></div><div><label>Age</label><input data-key="protagonist.age"></div></div><label>Personality</label><textarea data-key="protagonist.personality"></textarea><label>What do they want?</label><textarea data-key="protagonist.want"></textarea><label>What do they actually need?</label><textarea data-key="protagonist.need"></textarea><label>What are they afraid of?</label><textarea data-key="protagonist.fear"></textarea><label>How do they change?</label><textarea data-key="protagonist.change"></textarea></section>
<section><h2>4. Characters</h2><div id="characters"></div><button onclick="addCharacter()">+ Add Character</button></section>
<section><h2>5. Chapters</h2><div id="chapters"></div><button onclick="addChapter()">+ Add Chapter</button></section>
<section><h2>6. Choices & Endings</h2><label>How much player choice is there?</label><select data-key="choices.amount"><option value="">Select...</option><option>Mostly linear</option><option>Some meaningful choices</option><option>Branching</option><option>Highly branching</option></select><label>Important choices</label><textarea data-key="choices.important"></textarea><label>Different endings?</label><textarea data-key="choices.endings"></textarea></section>
<section><h2>7. World & Lore</h2><label>Setting</label><textarea data-key="world.setting"></textarea><label>Important locations</label><textarea data-key="world.locations"></textarea><label>Rules of the world</label><textarea data-key="world.rules"></textarea><label>Important lore / history</label><textarea data-key="world.lore"></textarea><label>Secrets the player should discover</label><textarea data-key="world.secrets"></textarea></section>
<section><h2>8. Presentation</h2><div class="grid"><div><label>Visual style</label><input data-key="presentation.visual"></div><div><label>Music / audio style</label><input data-key="presentation.audio"></div></div><label>UI / special presentation ideas</label><textarea data-key="presentation.ui"></textarea><label>References / inspirations</label><textarea data-key="presentation.inspiration"></textarea></section>
<section><h2>9. Development</h2><label>Engine / tools</label><input data-key="development.tools"><label>Must-have features</label><textarea data-key="development.mustHave"></textarea><label>Nice-to-have features</label><textarea data-key="development.niceToHave"></textarea><label>Things to avoid / scope limits</label><textarea data-key="development.scope"></textarea></section>
<section><h2>10. Free Notes</h2><textarea data-key="notes" style="min-height:220px" placeholder="Anything that doesn't fit elsewhere..."></textarea></section></main>
<script>
const KEY='vn-planner-v1';
const fields=()=>[...document.querySelectorAll('[data-key]')];
const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function get(o,k){return k.split('.').reduce((x,p)=>x?.[p],'')??''}
function collect(){let d={};fields().forEach(e=>{let p=e.dataset.key.split('.'),o=d;p.forEach((k,i)=>i===p.length-1?o[k]=e.value:o=o[k]||={})});d.characters=[...document.querySelectorAll('#characters .item')].map(x=>Object.fromEntries(['name','role','personality','want','fear','relationship','arc'].map(k=>[k,x.querySelector('[data-field="'+k+'"]').value])));d.chapters=[...document.querySelectorAll('#chapters .item')].map(x=>Object.fromEntries(['title','purpose','events','choices','ending'].map(k=>[k,x.querySelector('[data-field="'+k+'"]').value])));return d}
function fill(d){fields().forEach(e=>e.value=get(d,e.dataset.key));document.getElementById('characters').innerHTML='';(d.characters||[]).forEach(addCharacter);document.getElementById('chapters').innerHTML='';(d.chapters||[]).forEach(addChapter);bind()}
function addCharacter(d={}){let x=document.createElement('div');x.className='item';x.innerHTML='<div class="item-title"><input data-field="name" placeholder="Character name" value="'+esc(d.name)+'"><button class="remove" onclick="this.closest(\'.item\').remove();autoSave()">Remove</button></div><div class="grid"><div><label>Role</label><input data-field="role" value="'+esc(d.role)+'"></div><div><label>Personality</label><input data-field="personality" value="'+esc(d.personality)+'"></div></div><div class="grid"><div><label>What do they want?</label><textarea data-field="want">'+esc(d.want)+'</textarea></div><div><label>What are they afraid of?</label><textarea data-field="fear">'+esc(d.fear)+'</textarea></div></div><label>Relationship to protagonist</label><textarea data-field="relationship">'+esc(d.relationship)+'</textarea><label>Character arc / change</label><textarea data-field="arc">'+esc(d.arc)+'</textarea>';document.getElementById('characters').appendChild(x);bind()}
function addChapter(d={}){let x=document.createElement('div');x.className='item';x.innerHTML='<div class="item-title"><input data-field="title" placeholder="Chapter title / number" value="'+esc(d.title)+'"><button class="remove" onclick="this.closest(\'.item\').remove();autoSave()">Remove</button></div><label>Purpose of this chapter</label><textarea data-field="purpose">'+esc(d.purpose)+'</textarea><label>Major events</label><textarea data-field="events">'+esc(d.events)+'</textarea><label>Choices / player interaction</label><textarea data-field="choices">'+esc(d.choices)+'</textarea><label>How does it end / lead into the next chapter?</label><textarea data-field="ending">'+esc(d.ending)+'</textarea>';document.getElementById('chapters').appendChild(x);bind()}
function savePlan(){localStorage.setItem(KEY,JSON.stringify(collect()));document.getElementById('status').textContent='Saved locally • '+new Date().toLocaleTimeString()}
function autoSave(){clearTimeout(window.t);window.t=setTimeout(savePlan,300)}
function loadPlan(){let r=localStorage.getItem(KEY);if(r)fill(JSON.parse(r));else alert('No saved plan found in this browser.')}
function clearPlan(){if(confirm('Clear the current plan and browser save?')){localStorage.removeItem(KEY);location.reload()}}
function exportPlan(){let b=new Blob([JSON.stringify(collect(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='VN-Plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importPlan(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{fill(JSON.parse(r.result));savePlan()}catch{alert('Invalid VN Planner JSON file.')}};r.readAsText(f)}
function bind(){document.querySelectorAll('input,textarea,select').forEach(e=>e.oninput=autoSave)}bind();loadPlan();
</script></body></html>
